syntax = "proto3";

package grpcd;

import "grpcd/discover.proto";
import "grpcd/register.proto";
import "grpcd/watch.proto";

option go_package = "git.sonicoriginal.software/grpcd-protos;grpcd";

// GRPCDService handles service registration and method discovery
service GRPCDService {
  // Register a service instance with its methods and hold the stream.
  rpc Register(grpcd.RegisterRequest) returns (stream grpcd.RegisterResponse);

  // Discover addresses for a method, one candidate at a time.
  rpc Discover(stream grpcd.DiscoverRequest) returns (stream grpcd.DiscoverResponse);

  // Hold an address for a method and be told when to move to another.
  rpc Watch(grpcd.WatchRequest) returns (stream grpcd.WatchResponse);
}

syntax = "proto3";

package example;

option go_package = "git.sonicoriginal.software/grpcd-go/example/lib;example";

// Example service creates example data
service ExampleService {
  // Create an example
  rpc Create(CreateRequest) returns (CreateResponse);
}

// Request for an example
message CreateRequest {}

// Response containing example
message CreateResponse {
  string example = 1;
}
